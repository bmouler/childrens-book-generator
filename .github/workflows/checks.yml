name: checks

on:
  push:
  pull_request:

jobs:
  narration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python 3.11 --group checks python -m unittest discover -s narration -p "test_*.py"

  books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Compile every book
        working-directory: spike
        run: uv run --python 3.11 --group books python check_books.py
