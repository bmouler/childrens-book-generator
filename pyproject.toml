[project]
name = "childrens-book-generator"
version = "0.1.0"
description = "English and Russian picture books, and audiobooks in a voice you record."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC-BY-NC-4.0"}

[tool.uv]
package = false

[dependency-groups]
checks = ["numpy", "scipy"]
books = [
  "pymorphy3",
  "pymorphy3-dicts-ru",
  "pillow",
  "numpy",
  "scipy",
  "img2pdf",
]
pictures = ["httpx", "pillow"]
